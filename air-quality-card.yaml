# ============================================================
# Living Room Air Quality Card for Home Assistant
# ============================================================
#
# A custom Lovelace card that shows:
#   - An overall air quality score (0-100) with a circular gauge
#   - Temperature & humidity with a 24h trend mini-graph
#   - PM1.0, PM2.5, PM10, VOC, CO2 tiles with thresholds
#
# REQUIRED HACS FRONTEND CARDS:
#   - mod-card           (https://github.com/thomasloven/lovelace-mod-card)
#   - button-card        (https://github.com/custom-cards/button-card)
#   - mini-graph-card    (https://github.com/kalkih/mini-graph-card)
#
# WHAT TO CHANGE:
#   Replace every entity ID below with your own. Look for the
#   "REPLACE:" comments. The card uses 5 sensor entities:
#     - PM1.0, PM2.5, PM10  (any particulate sensor: PMS5003, SDS011, ESPHome air monitor, etc.)
#     - VOC index           (e.g. SGP40, SGP41, or remove if you don't have one)
#     - CO2                 (e.g. SCD41, SCD30, SwitchBot Meter Pro CO2, MH-Z19, etc.)
#     - Temperature         (any temp sensor)
#     - Humidity            (any humidity sensor)
#
# THE SCORE FORMULA:
#   100 - PM2.5 penalty (max 40) - VOC penalty (max 25) - CO2 penalty (max 35)
#   Tweak the divisors in the JS if you want different sensitivity.
#
# ============================================================

type: custom:mod-card
card_mod:
  style: |
    ha-card {
      background: var(--ha-card-background, #0f2845);
      border-radius: 22px;
      padding: 0;
      box-shadow: none;
      border: none;
    }
card:
  type: vertical-stack
  cards:

    # ---- TOP SECTION: score ring + temperature/humidity ----
    - type: custom:button-card
      entity: sensor.YOUR_VOC_ENTITY  # REPLACE: any sensor works here, only used for tap-to-expand
      tap_action:
        action: more-info
      show_icon: false
      show_name: false
      show_label: false
      show_state: false
      styles:
        card:
          - background: transparent
          - border: none
          - border-radius: 22px 22px 0 0
          - padding: 20px 20px 14px 20px
          - box-shadow: none
          - cursor: pointer
        grid:
          - grid-template-areas: '"body"'
          - grid-template-columns: 1fr
        custom_fields:
          body:
            - justify-self: stretch
            - width: 100%
      custom_fields:
        body: |
          [[[
            const safeNum = (id) => {
              const s = states[id]?.state;
              if (!s || s === 'unavailable' || s === 'unknown') return 0;
              const n = parseFloat(s);
              return isNaN(n) ? 0 : n;
            };

            // REPLACE these 5 entity IDs with your own:
            const pm25  = safeNum('sensor.YOUR_PM25_ENTITY');
            const voc   = safeNum('sensor.YOUR_VOC_ENTITY');
            const co2   = safeNum('sensor.YOUR_CO2_ENTITY');
            const temp  = safeNum('sensor.YOUR_TEMPERATURE_ENTITY');
            const humid = safeNum('sensor.YOUR_HUMIDITY_ENTITY');

            // Score weighting: PM2.5 (40 pts) + CO2 (35 pts) + VOC (25 pts) = 100
            const pm25Penalty = Math.min(40, Math.max(0, (pm25 / 35) * 40));
            const vocPenalty  = Math.min(25, Math.max(0, (voc / 300) * 25));
            const co2Penalty  = Math.min(35, Math.max(0, ((co2 - 400) / 1600) * 35));
            const score = Math.max(0, Math.round(100 - pm25Penalty - vocPenalty - co2Penalty));

            let scoreColor = '#86efac', scoreLabel = 'Good', advice = 'Air quality is good';
            if (score < 80) { scoreColor = '#fde68a'; scoreLabel = 'Moderate'; advice = 'Air quality is moderate'; }
            if (score < 60) { scoreColor = '#fdba74'; scoreLabel = 'Poor'; advice = 'Consider ventilating'; }
            if (score < 40) { scoreColor = '#fca5a5'; scoreLabel = 'Bad'; advice = 'Ventilate now'; }

            if (pm25 > 12) advice = 'Particles elevated';
            if (voc > 200) advice = 'VOCs detected';
            if (co2 > 1000) advice = 'CO2 high - open a window';
            if (co2 > 1500) advice = 'CO2 very high - ventilate';

            const radius = 42;
            const circ = 2 * Math.PI * radius;
            const dashOffset = circ - (score / 100) * circ;

            const r = parseInt(scoreColor.slice(1,3),16);
            const g = parseInt(scoreColor.slice(3,5),16);
            const b = parseInt(scoreColor.slice(5,7),16);

            return `
              <div style="display:flex;flex-direction:column;width:100%;font-family:Google Sans, Roboto, system-ui, sans-serif;color:#ffffff;text-align:left;box-sizing:border-box;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;">
                  <div>
                    <div style="font-size:15px;color:#ffffff;font-weight:500;">Living Room</div>
                    <div style="font-size:11px;color:#6e87a8;margin-top:2px;">Climate · Air Quality</div>
                  </div>
                  <div style="background:rgba(${r},${g},${b},0.12);border:1px solid rgba(${r},${g},${b},0.35);border-radius:999px;padding:5px 12px;font-size:11px;color:${scoreColor};display:flex;align-items:center;gap:6px;">
                    <span style="width:6px;height:6px;background:${scoreColor};border-radius:50%;"></span>${scoreLabel}
                  </div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <div>
                    <div style="display:flex;align-items:baseline;gap:6px;">
                      <span style="font-size:54px;font-weight:400;color:${scoreColor};line-height:1;">${score}</span>
                      <span style="font-size:14px;color:#a8c0e0;">/ 100</span>
                    </div>
                    <div style="font-size:12px;color:#a8c0e0;margin-top:6px;">${advice}</div>

                    <div style="display:flex;gap:14px;margin-top:14px;">
                      <div>
                        <div style="display:flex;align-items:baseline;gap:4px;">
                          <span style="font-size:24px;font-weight:400;color:#ffffff;">${temp.toFixed(1)}</span>
                          <span style="font-size:11px;color:#a8c0e0;">°C</span>
                        </div>
                        <div style="font-size:10px;color:#6e87a8;margin-top:2px;">TEMPERATURE</div>
                      </div>
                      <div style="width:1px;background:#1e3a5f;"></div>
                      <div>
                        <div style="display:flex;align-items:baseline;gap:4px;">
                          <span style="font-size:24px;font-weight:400;color:#ffffff;">${humid.toFixed(0)}</span>
                          <span style="font-size:11px;color:#a8c0e0;">%</span>
                        </div>
                        <div style="font-size:10px;color:#6e87a8;margin-top:2px;">HUMIDITY</div>
                      </div>
                    </div>
                  </div>

                  <div style="position:relative;width:100px;height:100px;flex-shrink:0;">
                    <svg viewBox="0 0 100 100" style="transform:rotate(-90deg);width:100%;height:100%;">
                      <circle cx="50" cy="50" r="${radius}" fill="none" stroke="#1e3a5f" stroke-width="8"/>
                      <circle cx="50" cy="50" r="${radius}" fill="none" stroke="${scoreColor}" stroke-width="8" stroke-dasharray="${circ}" stroke-dashoffset="${dashOffset}" stroke-linecap="round"/>
                    </svg>
                    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                      <div style="font-size:11px;color:#a8c0e0;">SCORE</div>
                      <div style="font-size:11px;color:${scoreColor};font-weight:500;">${score}%</div>
                    </div>
                  </div>
                </div>
              </div>
            `;
          ]]]

    # ---- MIDDLE SECTION: 24h temperature/humidity trend ----
    - type: custom:mini-graph-card
      entities:
        - entity: sensor.YOUR_TEMPERATURE_ENTITY  # REPLACE
          name: Temp
          color: '#fde68a'
        - entity: sensor.YOUR_HUMIDITY_ENTITY  # REPLACE
          name: Humidity
          color: '#a8c0e0'
          y_axis: secondary
      hours_to_show: 24
      points_per_hour: 2
      line_width: 2
      animate: true
      smoothing: true
      hour24: true
      height: 60
      show:
        name: false
        icon: false
        state: false
        legend: true
        labels: false
        fill: fade
      card_mod:
        style: |
          ha-card {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 0 14px !important;
            margin: 0 6px 14px 6px;
          }

    # ---- BOTTOM SECTION: PM tiles (row 1) + VOC/CO2 tiles (row 2) ----
    - type: custom:button-card
      entity: sensor.YOUR_PM25_ENTITY  # REPLACE: only used for tap-to-expand
      tap_action:
        action: more-info
      show_icon: false
      show_name: false
      show_label: false
      show_state: false
      styles:
        card:
          - background: transparent
          - border: none
          - border-radius: 0 0 22px 22px
          - padding: 0 20px 20px 20px
          - box-shadow: none
        grid:
          - grid-template-areas: '"tiles"'
          - grid-template-columns: 1fr
        custom_fields:
          tiles:
            - justify-self: stretch
            - width: 100%
      custom_fields:
        tiles: |
          [[[
            const safeNum = (id) => {
              const s = states[id]?.state;
              if (!s || s === 'unavailable' || s === 'unknown') return 0;
              const n = parseFloat(s);
              return isNaN(n) ? 0 : n;
            };

            // REPLACE these 5 entity IDs:
            const pm1  = safeNum('sensor.YOUR_PM1_ENTITY');
            const pm25 = safeNum('sensor.YOUR_PM25_ENTITY');
            const pm10 = safeNum('sensor.YOUR_PM10_ENTITY');
            const voc  = safeNum('sensor.YOUR_VOC_ENTITY');
            const co2  = safeNum('sensor.YOUR_CO2_ENTITY');

            // Threshold function: returns label, color, and bar fill % based on value
            // Args: (value, "good" cap, "moderate" cap, "high" cap)
            const thresh = (value, good, mod, high) => {
              if (value <= good) return { label: 'GOOD', color: '#86efac', pct: Math.min(100, (value/high)*100) };
              if (value <= mod)  return { label: 'MOD',  color: '#fde68a', pct: Math.min(100, (value/high)*100) };
              if (value <= high) return { label: 'HIGH', color: '#fdba74', pct: Math.min(100, (value/high)*100) };
              return { label: 'V.HIGH', color: '#fca5a5', pct: 100 };
            };

            // Thresholds based on WHO/EPA guidelines + ASHRAE for CO2
            // Tweak these to your preference
            const pm1S  = thresh(pm1, 10, 25, 50);
            const pm25S = thresh(pm25, 12, 35, 75);
            const pm10S = thresh(pm10, 50, 150, 250);
            const vocS  = thresh(voc, 100, 200, 300);
            const co2S  = thresh(co2, 800, 1200, 2000);

            const tile = (name, value, unit, st) => `
              <div style="padding:0 6px;min-width:0;overflow:hidden;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:4px;">
                  <span style="font-size:11px;color:#a8c0e0;font-weight:500;white-space:nowrap;">${name}</span>
                  <span style="font-size:9px;color:${st.color};white-space:nowrap;">${st.label}</span>
                </div>
                <div style="display:flex;align-items:baseline;gap:4px;">
                  <span style="font-size:22px;font-weight:400;color:#ffffff;line-height:1;white-space:nowrap;">${value.toLocaleString()}</span>
                  <span style="font-size:10px;color:#6e87a8;white-space:nowrap;">${unit}</span>
                </div>
                <div style="height:3px;background:#1e3a5f;border-radius:2px;overflow:hidden;margin-top:8px;">
                  <div style="height:100%;width:${st.pct}%;background:${st.color};"></div>
                </div>
              </div>
            `;

            return `
              <div style="padding-top:14px;border-top:1px solid #1e3a5f;">
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;font-family:Google Sans, Roboto, system-ui, sans-serif;margin-bottom:14px;">
                  ${tile('PM1.0', pm1, 'µg/m³', pm1S)}
                  ${tile('PM2.5', pm25, 'µg/m³', pm25S)}
                  ${tile('PM10', pm10, 'µg/m³', pm10S)}
                </div>
                <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;font-family:Google Sans, Roboto, system-ui, sans-serif;">
                  ${tile('VOC', voc, 'index', vocS)}
                  ${tile('CO₂', co2, 'ppm', co2S)}
                </div>
              </div>
            `;
          ]]]
